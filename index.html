<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Foto-Wetter Pro Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-main: #1c1c1e;
            --text-muted: #636366;
            --accent: #007aff;
            --border: #d1d1d6;
            --excellent: #24b04b; 
            --good: #30b0c7;      
            --neutral: #ff9500;   
            --doubtful: #ff3b30;  
            --poor: #8e8e93;      
            --drama: #a855f7;
            --shadow: 0 8px 24px rgba(0,0,0,0.1);
            --radius: 14px;
            --ai-glow: 0 0 15px rgba(168, 85, 247, 0.4);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --card-bg: #1c1c1e;
                --text-main: #f5f5f7;
                --text-muted: #8e8e93;
                --border: #38383a;
            }
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        html, body { overflow-x: hidden; width: 100%; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.5; }
        
        .hero { 
            height: 200px; 
            background: #1c1c1e;
            position: relative; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            text-align: center; color: white; border-bottom: 1px solid var(--border); overflow: hidden; 
        }
        .hero-img { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; 
            opacity: 0.55; 
            z-index: 0; 
        }
        .hero-content { position: relative; z-index: 1; padding: 0 20px; text-shadow: 0 2px 15px rgba(0,0,0,0.8); }
        .hero h1 { margin: 0; font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; }
        .hero p { opacity: 0.95; font-size: 0.95rem; margin-top: 6px; font-weight: 600; }

        .container { max-width: 950px; margin: 0 auto 40px; padding: 24px 12px; width: 100%; }
        
        .control-card { 
            background: var(--card-bg); padding: 20px; border-radius: var(--radius); 
            box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 24px; margin-top: -60px; position: relative; z-index: 10; 
        }
        .search-group { display: flex; gap: 8px; margin-bottom: 12px; }
        input[type="text"], input[type="password"] { flex: 1; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-color); color: var(--text-main); outline: none; font-size: 1rem; -webkit-appearance: none; }
        
        button { padding: 10px 18px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.85rem; transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-secondary { background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border); }
        .btn-gps { background: var(--bg-color); color: var(--accent); border: 1px solid var(--accent); padding: 10px; width: 46px; }
        .btn-ai { background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%); color: white; box-shadow: var(--ai-glow); }

        .key-setup-banner { 
            background: rgba(168, 85, 247, 0.1); 
            padding: 12px; border-radius: 10px; margin-bottom: 15px; 
            font-size: 0.8rem; display: none; border: 1px solid rgba(168, 85, 247, 0.2);
        }
        .key-setup-banner.active { display: block; }
        .config-link { color: var(--text-muted); font-size: 0.7rem; cursor: pointer; text-decoration: underline; margin-top: 10px; display: inline-block; }

        .fav-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; }
        .fav-chip { background: var(--bg-color); padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; display: flex; align-items: center; gap: 8px; cursor: pointer; border: 1px solid var(--border); }
        
        #searchResults { list-style: none; padding: 0; margin: 0; border: 1px solid var(--border); border-radius: 10px; max-height: 250px; overflow-y: auto; background: var(--card-bg); position: absolute; left: 20px; right: 20px; top: 70px; z-index: 100; box-shadow: var(--shadow); }
        #searchResults li { padding: 14px 16px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
        #searchResults li:hover { background: var(--bg-color); }

        .day-accordion { background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 12px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .day-header { padding: 16px 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .day-name { font-weight: 700; font-size: 1rem; flex: 1; }
        .day-pills { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
        .pill { padding: 6px 10px; border-radius: 8px; font-weight: 700; color: white; font-size: 0.75rem; text-align: center; cursor: pointer; transition: transform 0.1s; }
        .pill:hover { transform: scale(1.05); filter: brightness(1.1); }

        .day-content { display: none; padding: 16px; border-top: 1px solid var(--border); background: #fafafa; }
        @media (prefers-color-scheme: dark) { .day-content { background: #151517; } }
        .day-accordion.open .day-content { display: block; }

        .tab-bar { display: flex; background: var(--bg-color); border-radius: 10px; padding: 4px; margin-bottom: 20px; gap: 4px; }
        .tab-btn { flex: 1; padding: 10px 4px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); cursor: pointer; text-align: center; border: none; background: none; transition: all 0.2s; }
        .tab-btn.active { background: var(--card-bg); color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .tab-panel { display: none; animation: fadeIn 0.3s ease; }
        .tab-panel.active { display: block; }

        .dim-row { margin-bottom: 12px; }
        .dim-label { font-size: 0.75rem; color: var(--text-muted); display: flex; justify-content: space-between; margin-bottom: 4px; }
        .dim-bar-bg { height: 8px; background: var(--bg-color); border-radius: 4px; overflow: hidden; }
        .dim-bar-fill { height: 100%; transition: width 1s ease; }

        .decision-label { font-size: 1.2rem; font-weight: 800; margin-bottom: 6px; display: block; }
        .decision-sub { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 18px; display: block; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; margin-right: 8px; margin-bottom: 8px;}
        .badge-fog { background: rgba(48, 176, 199, 0.15); color: var(--good); border: 1px solid var(--good); }
        .badge-cond { background: rgba(255, 59, 48, 0.1); color: var(--doubtful); border: 1px solid var(--doubtful); }
        .badge-drama { background: rgba(168, 85, 247, 0.15); color: var(--drama); border: 1px solid var(--drama); animation: pulse 2s infinite; }
        .badge-horizon-free { background: rgba(36, 176, 75, 0.1); color: var(--excellent); border: 1px solid var(--excellent); }
        .badge-horizon-blocked { background: rgba(142, 142, 147, 0.15); color: var(--poor); border: 1px solid var(--poor); }

        .ai-result-box { 
            background: linear-gradient(to right, rgba(168, 85, 247, 0.05), rgba(99, 102, 241, 0.05));
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 12px; padding: 20px; margin: 18px 0; font-size: 0.9rem; display: none; 
            animation: fadeIn 0.5s ease; line-height: 1.6; color: var(--text-main);
        }
        .ai-result-box.visible { display: block; }
        .ai-header { color: #a855f7; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
        .ai-section-title { font-weight: 700; margin-top: 18px; margin-bottom: 8px; color: var(--accent); font-size: 0.9rem; text-transform: uppercase; border-bottom: 1px solid rgba(0, 122, 255, 0.1); padding-bottom: 4px; display: block; width: 100%; }
        
        .tldr-box { font-size: 1rem; font-weight: 600; color: var(--text-main); margin-bottom: 14px; border-left: 4px solid #a855f7; padding-left: 12px; }
        
        .interval-badge { display: inline-block; background: #a855f7; color: white; padding: 2px 10px; border-radius: 6px; font-weight: 800; font-size: 0.85rem; margin-left: 10px; }

        .table-container { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--card-bg); margin-top: 12px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.75rem; white-space: nowrap; }
        th { background: var(--bg-color); text-align: left; padding: 14px 12px; font-weight: 700; color: var(--text-muted); }
        td { padding: 14px 12px; border-bottom: 1px solid var(--border); }

        .status { text-align: center; padding: 30px; color: var(--text-muted); font-size: 1rem; min-height: 80px; }
        .icon-svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; vertical-align: middle; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { opacity: 0.7; } 50% { opacity: 1; } 100% { opacity: 0.7; } }
        .loading-dots:after { content: '.'; animation: dots 1.5s infinite; }
        @keyframes dots { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="hero">
    <img src="DSC09603.jpg" class="hero-img" id="mainHeroImg" alt="Photography Landscape" onerror="this.src='https://images.unsplash.com/photo-1504608524841-42fe6f032b4b?auto=format&fit=crop&w=1400&q=80'">
    <div class="hero-content">
        <h1>Foto-Wetter Pro</h1>
        <p>Ausrüstungszentrierte Präzisions-Analyse (v69)</p>
    </div>
</div>

<div class="container">
    <div class="control-card">
        <div class="search-group">
            <button class="btn-gps" onclick="getLocation()" title="Aktueller Standort"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg></button>
            <input type="text" id="locInput" placeholder="Ort suchen..." onkeypress="if(event.key==='Enter') searchLocation()">
            <button class="btn-primary" onclick="searchLocation()" id="searchBtn">Suchen</button>
            <button class="btn-secondary hidden" id="saveFavBtn" onclick="toggleFavorite()"><svg class="icon-svg" style="color:#eb4d4b;" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> Speichern</button>
        </div>

        <div id="keySetup" class="key-setup-banner">
            <p style="margin:0 0 8px 0;"><strong>KI-Schnittstelle konfigurieren:</strong> Privater Key wird lokal gespeichert.</p>
            <div style="display:flex; gap:8px;">
                <input type="password" id="apiKeyInput" placeholder="Schlüssel hier einfügen...">
                <button class="btn-primary" onclick="saveApiKey()" style="padding:8px 14px;">Aktivieren</button>
            </div>
            <p style="font-size:0.65rem; margin:6px 0 0 0; opacity:0.7;">Kostenlos unter: <a href="https://aistudio.google.com/app/apikey" target="_blank" style="color:inherit;">aistudio.google.com</a></p>
        </div>
        
        <span class="config-link" onclick="document.getElementById('keySetup').classList.toggle('active')">KI-Schnittstelle manuell konfigurieren</span>

        <ul id="searchResults" class="hidden"></ul>
        <div id="favoritesContainer" class="fav-list hidden"></div>
    </div>

    <div id="status" class="status">Bitte wählen Sie einen Standort oder nutzen Sie GPS.</div>

    <div id="dashboard" class="hidden">
        <div id="forecast"></div>
    </div>
</div>

<script>
    /**
     * REVISIONS-HISTORIE (v69)
     * --------------------------------------------------
     * v69: Dynamische Modellauswahl repariert API-Fehler (gemini-2.5-flash).
     * Hero-Image lädt wieder das lokale Bild DSC09603.jpg.
     * --------------------------------------------------
     */

    const STORAGE_KEY = 'foto_pro_app_favorites_v5';
    const LAST_LOC_KEY = 'foto_pro_app_last_loc_v5';
    const API_KEY_STORAGE = 'foto_pro_gemini_api_key_v5';
    const apiKey = ""; 
    
    const ICONS = {
        sunrise: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 17V3m0 0l-4 4m4-4l4 4M2 17h20M5 12a7 7 0 0 1 14 0"/></svg>`,
        sunset: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 3v14m0 0l-4-4m4 4l4-4M2 17h20M5 12a7 7 0 0 1 14 0"/></svg>`,
        sunHigh: `<svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`,
        moon: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`,
        export: `<svg class="icon-svg" viewBox="0 0 24 24" style="width:14px; height:14px;"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>`,
        chevron: `<svg class="icon-svg" style="width:14px; height:14px; opacity:0.3;" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>`,
        ai: `<svg class="icon-svg" viewBox="0 0 24 24" style="width:16px; height:16px;"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71L12 2zM12 15.5l-4.5 2L12 4.5l4.5 13-4.5-2z"/></svg>`,
        storm: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M13 2l-9 13h9l-1 7 9-13h-9l1-7z"/></svg>`
    };

    let currentLoc = null;
    let weekData = [];

    const parseVal = (val) => {
        if (!val) return "Keine Daten.";
        if (typeof val === 'string') return val;
        if (Array.isArray(val)) return val.map(v => typeof v === 'object' ? JSON.stringify(v) : v).join(" ");
        if (typeof val === 'object') return Object.values(val).join(" ");
        return String(val);
    };

    function getDestinationPoint(lat, lon, distance_km, bearing_deg) {
        const R = 6371; 
        const brng = bearing_deg * Math.PI / 180;
        const lat1 = lat * Math.PI / 180;
        const lon1 = lon * Math.PI / 180;
        let lat2 = Math.asin(Math.sin(lat1) * Math.cos(distance_km / R) + Math.cos(lat1) * Math.sin(distance_km / R) * Math.cos(brng));
        let lon2 = lon1 + Math.atan2(Math.sin(brng) * Math.sin(distance_km / R) * Math.cos(lat1), Math.cos(distance_km / R) - Math.sin(lat1) * Math.sin(lat2));
        return { lat: lat2 * 180 / Math.PI, lon: lon2 * 180 / Math.PI };
    }

    function saveApiKey() {
        const val = document.getElementById('apiKeyInput').value.trim();
        if (val) {
            localStorage.setItem(API_KEY_STORAGE, val);
            document.getElementById('keySetup').classList.remove('active');
            document.getElementById('status').innerText = "✓ Key gespeichert.";
        }
    }

    function getEffectiveKey() { return apiKey || localStorage.getItem(API_KEY_STORAGE) || ""; }

    function getLocation() {
        const status = document.getElementById('status');
        if (!navigator.geolocation) { showErr("GPS nicht unterstützt."); return; }
        status.innerHTML = `<span class="loading-dots">Ortung läuft</span>`;
        navigator.geolocation.getCurrentPosition(
            (pos) => fetchWeather(pos.coords.latitude, pos.coords.longitude, "Aktueller Standort"),
            (err) => showErr("Ortung fehlgeschlagen."),
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    }

    async function fetchWithRetry(url, options = {}, retries = 5, backoffIdx = 0, statusUpdateFn = null) {
        const backoffs = [1000, 2000, 4000, 8000, 16000];
        try {
            const res = await fetch(url, options);
            if (!res.ok) {
                const errData = await res.json().catch(() => ({}));
                const msg = errData.error?.message || `HTTP ${res.status}`;
                throw new Error(msg);
            }
            return await res.json();
        } catch (err) {
            if (retries <= 0) throw err;
            if (statusUpdateFn) statusUpdateFn(5 - retries + 1);
            await new Promise(r => setTimeout(r, backoffs[backoffIdx] || 16000));
            return fetchWithRetry(url, options, retries - 1, backoffIdx + 1, statusUpdateFn);
        }
    }

    const getFavs = () => JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    const getBarColor = (val) => val >= 85 ? 'var(--excellent)' : (val >= 60 ? 'var(--neutral)' : 'var(--doubtful)');
    const getScoreColor = (s) => s >= 80 ? 'var(--excellent)' : (s >= 65 ? 'var(--good)' : (s >= 45 ? 'var(--neutral)' : 'var(--doubtful)'));
    const showErr = (m) => { document.getElementById('status').innerHTML = `<span style="color:var(--doubtful); font-weight:600;">${m}</span>`; };

    function getMoonPhase(date) {
        const lp = 2551443; const now = date.getTime();
        const new_moon = new Date(1970, 0, 7, 20, 35, 0).getTime();
        const phase = ((now - new_moon) % lp) / lp;
        if (phase < 0.06 || phase > 0.94) return "Neumond";
        if (phase < 0.56 && phase > 0.44) return "Vollmond";
        return phase < 0.5 ? "Zunehmender Mond" : "Abnehmender Mond";
    }

    function getDecisionLabel(score, hasDrama) {
        if (hasDrama && score >= 40) return { text: "⛈️ Extremes Drama-Potential", color: "var(--drama)" };
        if (score >= 81) return { text: "🔥 Epische Bedingungen", color: "var(--excellent)" };
        if (score >= 66) return { text: "✨ Rausgehen lohnt sich", color: "var(--excellent)" };
        if (score >= 46) return { text: "👍 Solide Fotogelegenheit", color: "var(--good)" };
        if (score >= 26) return { text: "🚶‍♂️ Nur für Spaziergang", color: "var(--neutral)" };
        return { text: " Couch-Wetter / Nicht lohnend", color: "var(--doubtful)" };
    }

    async function getAIStrategy(locName, dayIdx, type) {
        const activeKey = getEffectiveKey();
        const resultId = `ai-result-${dayIdx}-${type}`;
        const container = document.getElementById(resultId);
        
        const btn = document.getElementById(`ai-btn-${dayIdx}-${type}`);
        container.innerHTML = `<div class="ai-header">${ICONS.ai} KI-ASSISTENT</div><span class="loading-dots">Analysiere Bedingungen</span>`;
        container.classList.add('visible');
        btn.disabled = true;

        const day = weekData[dayIdx];
        const typeKeyMap = { 'Morgen': 'sunrise', 'Vormittag': 'forenoon', 'Nachmittag': 'afternoon', 'Abend': 'sunset' };
        const ev = day[typeKeyMap[type] || type.toLowerCase()];
        
        if (!ev || !ev.samples) {
            container.innerHTML = "Fehler: Lokale Analysedaten fehlen.";
            btn.disabled = false;
            return;
        }

        const main = ev.samples[1];
        const isCanvas = window.location.hostname.includes('usercontent.goog');
        const model = isCanvas ? "gemini-2.5-flash-preview-09-2025" : "gemini-2.5-flash";
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${activeKey}`;
        
        const systemPrompt = `Du bist ein rationaler Produktions-Assistent für Fotografie (Sony A7 IV). Antworte EXKLUSIV als JSON-Objekt mit den Feldern: "tldr", "motives_gear", "timelapse", "interval_val", "interval_reason". Vermeide Erwähnungen der Insta360.`;

        const payload = {
            contents: [{ parts: [{ text: `Kontext: ${locName}. Tour: ${type}. Horizont: ${ev.horizonBlocked ? "Blockiert" : "Frei"}. Drama: ${ev.hasDrama}. Wetter: Temp ${main.temp.toFixed(1)}°C, Wolken (H/M/L) ${main.cHigh}/${main.cMid}/${main.cLow}%, Score ${ev.score}%.` }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] },
            generationConfig: { 
                responseMimeType: "application/json",
                responseSchema: {
                    type: "OBJECT",
                    properties: {
                        tldr: { type: "STRING" },
                        motives_gear: { type: "STRING" },
                        timelapse: { type: "STRING" },
                        interval_val: { type: "STRING" },
                        interval_reason: { type: "STRING" }
                    },
                    required: ["tldr", "motives_gear", "timelapse", "interval_val", "interval_reason"]
                }
            }
        };

        try {
            const result = await fetchWithRetry(url, {
                method: "POST", 
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            }, 5, 0, (retryNum) => {
                container.innerHTML = `<div class="ai-header">${ICONS.ai} KI-ASSISTENT</div><span class="loading-dots">Dienst ausgelastet (Versuch ${retryNum}/5)</span>`;
            });

            const rawText = result.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!rawText) throw new Error("Server lieferte leere Antwort.");
            const aiData = JSON.parse(rawText);
            
            container.innerHTML = `
                <div class="ai-header">${ICONS.ai} KI-ANALYSE ERFOLGREICH</div>
                <div class="tldr-box">${parseVal(aiData.tldr)}</div>
                <div class="ai-section-title">Motiv & Setup</div>
                <div style="margin-bottom:12px;">${parseVal(aiData.motives_gear)}</div>
                <details><summary class="ai-section-title" style="cursor:pointer">Timelapse-Strategie <span class="interval-badge">${parseVal(aiData.interval_val)}</span></summary>
                <div style="padding-top:10px; font-size:0.85rem;"><b>Coach-Begründung:</b> ${parseVal(aiData.interval_reason)}<br><br>${parseVal(aiData.timelapse)}</div></details>
            `;
        } catch (e) { 
            let errorMsg = e.message;
            if (errorMsg.includes("429")) errorMsg = "Zu viele Anfragen (Rate Limit).";
            if (errorMsg.includes("403")) errorMsg = "API-Key ungültig oder nicht autorisiert.";
            container.innerHTML = `<div class="ai-header" style="color:var(--doubtful)">Analyse fehlgeschlagen</div><p style="font-size:0.8rem">${errorMsg}</p>`; 
        } finally { btn.disabled = false; }
    }

    function analyzeEvent(type, timeStr, mainHourly, nodeHourlies) {
        if (!timeStr || !mainHourly || typeof SunCalc === 'undefined') return null;
        const target = new Date(timeStr).getTime();
        let idx = 0; let min = Infinity;
        mainHourly.time.forEach((t, i) => { const d = Math.abs(new Date(t + ":00Z").getTime() - target); if (d < min) { min = d; idx = i; } });
        const samples = [-1, 0, 1].map(o => {
            const i = idx + o;
            return {
                label: o === 0 ? 'Kern' : `${o > 0 ? '+' : ''}${o}h`,
                temp: mainHourly.temperature_2m[i] || 0, hum: mainHourly.relative_humidity_2m[i] || 0,
                dew: mainHourly.dew_point_2m[i] || 0, cTot: mainHourly.cloud_cover[i] || 0,
                cLow: mainHourly.cloud_cover_low[i] || 0, cMid: mainHourly.cloud_cover_mid[i] || 0,
                cHigh: mainHourly.cloud_cover_high[i] || 0, wind: mainHourly.wind_speed_10m[i] || 0,
                gust: mainHourly.wind_gusts_10m[i] || 0, prec: mainHourly.precipitation_probability[i] || 0,
                lightning: (mainHourly.lightning_potential || [])[i] || 0
            };
        });
        const m = samples[1];
        let horizonBlocked = false;
        if (nodeHourlies && nodeHourlies.length === 3) {
            horizonBlocked = Math.max(nodeHourlies[0].cloud_cover_low[idx] || 0, nodeHourlies[1].cloud_cover_low[idx] || 0, nodeHourlies[2].cloud_cover_low[idx] || 0) > 60;
        }
        const hasDrama = m.lightning > 10 || m.gust > 45 || (m.cMid > 40 && m.cHigh > 50);
        let lS = 20; 
        if (m.cTot < 5) lS = 50; 
        else {
            if (m.cHigh > 25 && m.cHigh < 85) lS += 55; 
            if (m.cMid > 15 && m.cMid < 70) lS += 25;   
            if (m.cLow > 45) lS -= 50;                  
        }
        if (hasDrama) lS += 20; 
        if (horizonBlocked) lS -= 25;
        lS = Math.max(0, Math.min(100, lS));
        const maxPrec = Math.max(...samples.map(s => s.prec));
        const maxGust = Math.max(...samples.map(s => s.gust));
        let rS = 5 + (maxPrec * 0.9); 
        if (maxGust > 42) rS += 35;
        if (m.lightning > 15) rS += 60;
        return { 
            score: Math.round((lS * 0.6) + (Math.max(0, 100-rS) * 0.4)), 
            sub: { light: lS, risk: Math.min(100, Math.round(rS)) }, 
            samples, time: timeStr.split('T')[1], hasDrama, horizonBlocked,
            isFoggy: m.hum >= 93 && (m.temp - m.dew) <= 2.0 && m.wind < 15,
            isCondensation: (m.temp - m.dew) < 1.5, riskNotes: []
        };
    }

    async function fetchWeather(latRaw, lonRaw, name) {
        if (typeof SunCalc === 'undefined') { showErr("Bibliothek SunCalc fehlt."); return; }
        const lat = parseFloat(Number(latRaw).toFixed(2));
        const lon = parseFloat(Number(lonRaw).toFixed(2));
        const status = document.getElementById('status');
        status.innerHTML = `<span class="loading-dots">Lade Daten für ${name}</span>`;
        currentLoc = { lat, lon, name };
        localStorage.setItem(LAST_LOC_KEY, JSON.stringify(currentLoc));
        updateFavBtn();

        try {
            const today = new Date();
            const times = SunCalc.getTimes(today, lat, lon);
            const posSunrise = SunCalc.getPosition(times.sunrise, lat, lon);
            const posSunset = SunCalc.getPosition(times.sunset, lat, lon);
            const azSunrise = (posSunrise.azimuth * 180 / Math.PI + 180) % 360;
            const azSunset = (posSunset.azimuth * 180 / Math.PI + 180) % 360;

            const dists = [50, 100, 150];
            const mNodes = dists.map(d => getDestinationPoint(lat, lon, d, azSunrise));
            const eNodes = dists.map(d => getDestinationPoint(lat, lon, d, azSunset));
            const lats = [lat, ...mNodes.map(n=>n.lat.toFixed(2)), ...eNodes.map(n=>n.lat.toFixed(2))].join(',');
            const lons = [lon, ...mNodes.map(n=>n.lon.toFixed(2)), ...eNodes.map(n=>n.lon.toFixed(2))].join(',');

            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&timezone=auto&forecast_days=7&hourly=temperature_2m,relative_humidity_2m,dew_point_2m,precipitation_probability,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,wind_speed_10m,wind_gusts_10m,lightning_potential&daily=sunrise,sunset`;
            const data = await fetchWithRetry(url);
            const res = Array.isArray(data) ? data : [data];

            weekData = [];
            for(let i=0; i<7; i++) {
                const sRise = res[0].daily.sunrise[i];
                const dayStr = sRise.split('T')[0];
                weekData.push({
                    date: new Date(sRise),
                    sunrise: analyzeEvent('sunrise', sRise, res[0].hourly, res.slice(1,4).map(r=>r.hourly)),
                    forenoon: analyzeEvent('forenoon', `${dayStr}T10:00`, res[0].hourly, null),
                    afternoon: analyzeEvent('afternoon', `${dayStr}T15:00`, res[0].hourly, null),
                    sunset: analyzeEvent('sunset', res[0].daily.sunset[i], res[0].hourly, res.slice(4,7).map(r=>r.hourly)),
                    moon: { phase: getMoonPhase(new Date(sRise)) }
                });
            }
            renderForecast(name);
            status.innerHTML = `<strong>${name}</strong> (${lat.toFixed(2)}, ${lon.toFixed(2)})`;
        } catch(e) { showErr("Fehler: " + e.message); }
    }

    async function searchLocation() {
        const q = document.getElementById('locInput').value.trim();
        if (!q) return;
        const btn = document.getElementById('searchBtn');
        btn.disabled = true;
        try {
            const data = await fetchWithRetry(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=de&format=json`);
            const list = document.getElementById('searchResults');
            if (!data.results) { showErr("Ort nicht gefunden."); btn.disabled = false; return; }
            list.innerHTML = data.results.map(r => `<li onclick="selectResult(${r.latitude}, ${r.longitude}, '${r.name.replace(/'/g, "\\'")}')">${r.name} (${r.country})</li>`).join('');
            list.classList.remove('hidden');
        } catch(e) { showErr("Suche fehlgeschlagen."); } finally { btn.disabled = false; }
    }

    window.selectResult = (lat, lon, name) => { 
        const list = document.getElementById('searchResults');
        list.innerHTML = ""; 
        list.classList.add('hidden'); 
        fetchWeather(lat, lon, name); 
    };

    function renderForecast(name) {
        const container = document.getElementById('forecast');
        document.getElementById('dashboard').classList.remove('hidden');
        container.innerHTML = weekData.map((day, dIdx) => {
            const types = ['Sunrise', 'Forenoon', 'Afternoon', 'Sunset'];
            const labels = ['Morgen', 'Vormittag', 'Nachmittag', 'Abend'];
            return `
            <div class="day-accordion ${dIdx === 0 ? 'open' : ''}" id="day-acc-${dIdx}">
                <div class="day-header" onclick="toggleAccordion(${dIdx})">
                    <span class="day-name">${day.date.toLocaleDateString('de-DE', {weekday:'short', day:'2-digit', month:'short'})}</span>
                    <div class="day-pills">
                        ${types.map((t, i) => `<span class="pill" style="background:${getScoreColor(day[t.toLowerCase()].score)}" onclick="handlePillClick(event, ${dIdx}, ${i})">${labels[i][0]}: ${day[t.toLowerCase()].score}%</span>`).join('')}
                    </div>
                </div>
                <div class="day-content">
                    <div class="tab-bar">
                        ${labels.map((l, i) => `<button class="tab-btn ${i===0?'active':''}" id="tab-btn-${dIdx}-${i}" onclick="switchTab(${dIdx}, ${i})">${l}</button>`).join('')}
                    </div>
                    ${types.map((t, i) => `<div class="tab-panel ${i===0?'active':''}" id="panel-${dIdx}-${i}">${renderEvHTML(day[t.toLowerCase()], labels[i], name, dIdx, labels[i])}</div>`).join('')}
                </div>
            </div>`;
        }).join('');
    }

    window.handlePillClick = (event, dIdx, tabIdx) => {
        event.stopPropagation();
        const acc = document.getElementById(`day-acc-${dIdx}`);
        acc.classList.add('open');
        switchTab(dIdx, tabIdx);
    };

    window.toggleAccordion = (dIdx) => {
        const acc = document.getElementById(`day-acc-${dIdx}`);
        acc.classList.toggle('open');
    };

    window.switchTab = (dIdx, tabIdx) => {
        const parent = document.querySelector(`#day-acc-${dIdx} .day-content`);
        if (!parent) return;
        parent.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', i === tabIdx));
        parent.querySelectorAll('.tab-panel').forEach((p, i) => p.classList.toggle('active', i === tabIdx));
    };

    function renderEvHTML(ev, label, locName, dayIdx, type) {
        const safety = Math.max(0, 100 - ev.sub.risk);
        const dLabel = getDecisionLabel(ev.score, ev.hasDrama);
        const icon = (label === 'Morgen') ? ICONS.sunrise : (label === 'Abend' ? ICONS.sunset : ICONS.sunHigh);
        let badges = '';
        if (ev.hasDrama) badges += `<span class="badge badge-drama">${ICONS.storm} DRAMA</span>`;
        if (ev.isFoggy) badges += `<span class="badge badge-fog">Nebel</span>`;
        if (ev.isCondensation) badges += `<span class="badge badge-cond">Kondensat</span>`;
        if ((type === 'Morgen' || type === 'Abend') && !ev.horizonBlocked) badges += `<span class="badge badge-horizon-free">Horizont frei</span>`;
        return `
            <div>
                <div style="margin-bottom:12px; border-bottom:1px solid var(--border); padding-bottom:12px;">
                    <span class="decision-label" style="color: ${dLabel.color}">${dLabel.text}</span>
                    <span class="decision-sub">${icon} ${label} (${ev.score}%) • Zeit: ${ev.time} Uhr</span>
                    ${badges}
                </div>
                <div class="dim-row">
                    <div class="dim-label"><span>Licht-Potential</span><span>${ev.sub.light}%</span></div>
                    <div class="dim-bar-bg"><div class="dim-bar-fill" style="width:${ev.sub.light}%; background:${getBarColor(ev.sub.light)}"></div></div>
                </div>
                <div class="dim-row">
                    <div class="dim-label"><span>Sicherheit & Komfort</span><span>${safety}%</span></div>
                    <div class="dim-bar-bg"><div class="dim-bar-fill" style="width:${safety}%; background:${getBarColor(safety)}"></div></div>
                </div>
                <div class="ai-result-box" id="ai-result-${dayIdx}-${type}"></div>
                <div class="table-container">
                    <table>
                        <thead><tr><th>Phase</th><th>Temp</th><th>Wolken (H/M/L)</th><th>Wind/Böen</th></tr></thead>
                        <tbody>${ev.samples.map(s => `<tr><td>${s.label}</td><td>${s.temp.toFixed(1)}°</td><td>${s.cHigh}/${s.cMid}/${s.cLow}%</td><td>${s.wind.toFixed(0)}/${s.gust.toFixed(0)}</td></tr>`).join('')}</tbody>
                    </table>
                </div>
                <div style="display:flex; gap:8px; margin-top:15px;">
                    <button class="btn-ai" id="ai-btn-${dayIdx}-${type}" onclick="getAIStrategy('${locName}', ${dayIdx}, '${type}')" style="flex:1;">${ICONS.ai} KI-Analyse</button>
                    <button class="btn-secondary" style="flex:1; font-size:0.75rem;" onclick="copyTourLog('${locName}', ${dayIdx}, '${type}')">${ICONS.export} Log</button>
                </div>
            </div>`;
    }

    function toggleFavorite() {
        if (!currentLoc) return;
        let f = getFavs(); const i = f.findIndex(x => x.name === currentLoc.name);
        if (i === -1) f.push(currentLoc); else f.splice(i, 1);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(f)); renderFavorites(); updateFavBtn();
    }
    function renderFavorites() {
        const f = getFavs(); const c = document.getElementById('favoritesContainer');
        if (!c) return;
        c.innerHTML = f.map((x,i) => `<div class="fav-chip" onclick="fetchWeather(${x.lat},${x.lon},'${x.name}')">${x.name} <span onclick="event.stopPropagation(); removeFavorite(${i})">✕</span></div>`).join('');
        c.classList.toggle('hidden', f.length === 0);
    }
    function removeFavorite(i) { let f = getFavs(); f.splice(i,1); localStorage.setItem(STORAGE_KEY, JSON.stringify(f)); renderFavorites(); updateFavBtn(); }
    function updateFavBtn() { 
        const b = document.getElementById('saveFavBtn'); if (!currentLoc) return;
        b.classList.remove('hidden'); b.style.opacity = getFavs().some(x => x.name === currentLoc.name) ? '1' : '0.4'; 
    }

    function copyTourLog(name, dayIdx, type) {
        const day = weekData[dayIdx];
        const log = `FOTO-LOG [${name}] - ${day.date.toLocaleDateString()} (${type})`;
        const el = document.createElement('textarea'); 
        el.value = log; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
        const s = document.getElementById('status'); const old = s.innerText; s.innerText = `✓ Kopiert`; setTimeout(() => s.innerText = old, 2000);
    }

    function init() {
        const storedKey = localStorage.getItem(API_KEY_STORAGE);
        if (storedKey) document.getElementById('apiKeyInput').value = storedKey;
        renderFavorites();
        const last = JSON.parse(localStorage.getItem(LAST_LOC_KEY));
        if (last) fetchWeather(last.lat, last.lon, last.name);
    }
    
    if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', init); } else { init(); }
</script>
</body>
