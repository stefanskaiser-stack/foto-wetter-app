<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Foto-Wetter Pro Dashboard</title>
    <style>
        :root {
            --bg-color: #f2f2f7;
            --card-bg: #ffffff;
            --text-main: #1c1c1e;
            --text-muted: #636366;
            --accent: #007aff;
            --border: #d1d1d6;
            --excellent: #24b04b; 
            --good: #30b0c7;      
            --neutral: #ff9500;   
            --doubtful: #ff3b30;  
            --poor: #8e8e93;      
            --shadow: 0 8px 24px rgba(0,0,0,0.1);
            --radius: 14px;
            --ai-glow: 0 0 15px rgba(168, 85, 247, 0.4);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #000000;
                --card-bg: #1c1c1e;
                --text-main: #f5f5f7;
                --text-muted: #8e8e93;
                --border: #38383a;
            }
        }
        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        html, body { overflow-x: hidden; width: 100%; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.5; }
        
        .hero { 
            height: 180px; 
            background: #1c1c1e;
            position: relative; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            text-align: center; color: white; border-bottom: 1px solid var(--border); overflow: hidden; 
        }
        .hero-img { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            object-fit: cover; 
            object-position: center 65%; /* Fokus auf Horizont und Sonne */
            opacity: 0.85; 
            z-index: 0; 
        }
        .hero-content { position: relative; z-index: 1; padding: 0 20px; text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
        .hero h1 { margin: 0; font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }
        .hero p { opacity: 0.95; font-size: 0.9rem; margin-top: 4px; font-weight: 600; }

        .container { max-width: 950px; margin: 0 auto 40px; padding: 24px 12px; width: 100%; }
        
        .control-card { 
            background: var(--card-bg); padding: 20px; border-radius: var(--radius); 
            box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 24px; margin-top: -60px; position: relative; z-index: 10; 
        }
        .search-group { display: flex; gap: 8px; margin-bottom: 12px; }
        input[type="text"], input[type="password"] { flex: 1; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-color); color: var(--text-main); outline: none; font-size: 1rem; -webkit-appearance: none; }
        
        button { padding: 10px 18px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.85rem; transition: all 0.2s; -webkit-tap-highlight-color: transparent; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-secondary { background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border); }
        .btn-gps { background: var(--bg-color); color: var(--accent); border: 1px solid var(--accent); padding: 10px; width: 46px; }
        .btn-ai { background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%); color: white; box-shadow: var(--ai-glow); }

        .key-setup-banner { 
            background: rgba(168, 85, 247, 0.1); 
            padding: 12px; border-radius: 10px; margin-bottom: 15px; 
            font-size: 0.8rem; display: none; border: 1px solid rgba(168, 85, 247, 0.2);
        }
        .key-setup-banner.active { display: block; }
        .config-link { color: var(--text-muted); font-size: 0.7rem; cursor: pointer; text-decoration: underline; margin-top: 10px; display: inline-block; }

        .fav-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; }
        .fav-chip { background: var(--bg-color); padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; display: flex; align-items: center; gap: 8px; cursor: pointer; border: 1px solid var(--border); }
        
        #searchResults { list-style: none; padding: 0; margin: 0; border: 1px solid var(--border); border-radius: 10px; max-height: 250px; overflow-y: auto; background: var(--card-bg); position: absolute; left: 20px; right: 20px; top: 70px; z-index: 100; box-shadow: var(--shadow); }
        #searchResults li { padding: 14px 16px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
        #searchResults li:hover { background: var(--bg-color); }

        .day-accordion { background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border); margin-bottom: 12px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .day-header { padding: 16px 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .day-name { font-weight: 700; font-size: 1rem; flex: 1; }
        .pill { padding: 5px 12px; border-radius: 8px; font-weight: 700; color: white; font-size: 0.7rem; min-width: 95px; text-align: center; }

        .day-content { display: none; padding: 20px; border-top: 1px solid var(--border); background: #fafafa; }
        @media (prefers-color-scheme: dark) { .day-content { background: #151517; } }
        .day-accordion.open .day-content { display: block; }

        .dim-row { margin-bottom: 10px; }
        .dim-label { font-size: 0.72rem; color: var(--text-muted); display: flex; justify-content: space-between; margin-bottom: 2px; }
        .dim-bar-bg { height: 7px; background: var(--bg-color); border-radius: 4px; overflow: hidden; }
        .dim-bar-fill { height: 100%; transition: width 1s ease; }

        .decision-label { font-size: 1.1rem; font-weight: 800; margin-bottom: 4px; display: block; }
        .decision-sub { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 16px; display: block; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; margin-right: 6px; margin-bottom: 8px;}
        .badge-fog { background: rgba(48, 176, 199, 0.15); color: var(--good); border: 1px solid var(--good); }
        .badge-cond { background: rgba(255, 59, 48, 0.1); color: var(--doubtful); border: 1px solid var(--doubtful); }

        .ai-result-box { 
            background: linear-gradient(to right, rgba(168, 85, 247, 0.04), rgba(99, 102, 241, 0.04));
            border: 1px solid rgba(168, 85, 247, 0.15);
            border-radius: 12px; padding: 18px; margin: 15px 0; font-size: 0.88rem; display: none; 
            animation: fadeIn 0.5s ease; line-height: 1.6; color: var(--text-main);
        }
        .ai-result-box.visible { display: block; }
        .ai-header { color: #a855f7; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.8px; }
        .ai-section-title { font-weight: 700; margin-top: 15px; margin-bottom: 6px; color: var(--accent); font-size: 0.85rem; text-transform: uppercase; border-bottom: 1px solid rgba(0, 122, 255, 0.1); padding-bottom: 2px; display: block; width: 100%; }
        
        .tldr-box { font-size: 0.95rem; font-weight: 600; color: var(--text-main); margin-bottom: 12px; border-left: 3px solid #a855f7; padding-left: 10px; }
        
        .interval-badge { display: inline-block; background: #a855f7; color: white; padding: 2px 8px; border-radius: 6px; font-weight: 800; font-size: 0.8rem; margin-left: 10px; }

        .table-container { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--card-bg); margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.7rem; white-space: nowrap; }
        th { background: var(--bg-color); text-align: left; padding: 12px 10px; font-weight: 600; color: var(--text-muted); }
        td { padding: 12px 10px; border-bottom: 1px solid var(--border); }

        .status { text-align: center; padding: 30px; color: var(--text-muted); font-size: 0.95rem; min-height: 80px; }
        .icon-svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; vertical-align: middle; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .loading-dots:after { content: '.'; animation: dots 1.5s infinite; }
        @keyframes dots { 0% { opacity: 0; } 50% { opacity: 1; } 100% { opacity: 0; } }
    </style>
</head>
<body>

<div class="hero">
    <!-- Header-Bild durch User-Foto ersetzt. Datei DSC09603.jpg muss im selben Ordner liegen. -->
    <img src="DSC09603.jpg" class="hero-img" id="mainHeroImg" alt="Wetterstimmung Heide" onerror="this.src='https://images.unsplash.com/photo-1504608524841-42fe6f032b4b?auto=format&fit=crop&w=1400&q=80'">
    <div class="hero-content">
        <h1>Foto-Wetter Pro</h1>
        <p>Ausrüstungszentrierte Präzisions-Analyse</p>
    </div>
</div>

<div class="container">
    <div class="control-card">
        <div class="search-group">
            <button class="btn-gps" onclick="getLocation()" title="Aktueller Standort"><svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg></button>
            <input type="text" id="locInput" placeholder="Ort suchen..." onkeypress="if(event.key==='Enter') searchLocation()">
            <button class="btn-primary" onclick="searchLocation()" id="searchBtn">Suchen</button>
            <button class="btn-secondary hidden" id="saveFavBtn" onclick="toggleFavorite()"><svg class="icon-svg" style="color:#eb4d4b;" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg> Speichern</button>
        </div>

        <div id="keySetup" class="key-setup-banner">
            <p style="margin:0 0 8px 0;"><strong>KI-Funktion freischalten:</strong> Privater Gemini API Key erforderlich. Speicherung erfolgt lokal.</p>
            <div style="display:flex; gap:8px;">
                <input type="password" id="apiKeyInput" placeholder="Schlüssel hier einfügen...">
                <button class="btn-primary" onclick="saveApiKey()" style="padding:8px 14px;">Aktivieren</button>
            </div>
            <p style="font-size:0.65rem; margin:6px 0 0 0; opacity:0.7;">Kostenlos unter: <a href="https://aistudio.google.com/app/apikey" target="_blank" style="color:inherit;">aistudio.google.com</a></p>
        </div>
        
        <span class="config-link" onclick="document.getElementById('keySetup').classList.toggle('active')">KI-Schnittstelle konfigurieren</span>

        <ul id="searchResults" class="hidden"></ul>
        <div id="favoritesContainer" class="fav-list hidden"></div>
    </div>

    <div id="status" class="status">Bitte wählen Sie einen Standort oder nutzen Sie GPS.</div>

    <div id="dashboard" class="hidden">
        <div id="forecast"></div>
    </div>
</div>

<script>
    /**
     * REVISIONS-HISTORIE (v60)
     * --------------------------------------------------
     * v60: Header-Bild durch DSC09603.jpg (Heide-Sonnenuntergang) ersetzt und Beschnitt optimiert
     * v59.3: Copy-Paste Failsafe für API-Key Input & KI-Fokus auf Brennweiten
     * v59.1: Failsafe-Parser für JSON-Datenstrukturen ergänzt ([object Object] Fix)
     * v59: UX Overhaul - Handlungsorientierte Labels, Nebel/Kondensations-Badges, KI Kurzfazit
     * --------------------------------------------------
     */

    const STORAGE_KEY = 'foto_pro_app_favorites_v5';
    const LAST_LOC_KEY = 'foto_pro_app_last_loc_v5';
    const API_KEY_STORAGE = 'foto_pro_gemini_api_key_v5';
    const apiKey = ""; 
    
    const ICONS = {
        sunrise: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 17V3m0 0l-4 4m4-4l4 4M2 17h20M5 12a7 7 0 0 1 14 0"/></svg>`,
        sunset: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M12 3v14m0 0l-4-4m4 4l4-4M2 17h20M5 12a7 7 0 0 1 14 0"/></svg>`,
        moon: `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`,
        export: `<svg class="icon-svg" viewBox="0 0 24 24" style="width:14px; height:14px;"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>`,
        chevron: `<svg class="icon-svg" style="width:14px; height:14px; opacity:0.3;" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>`,
        ai: `<svg class="icon-svg" viewBox="0 0 24 24" style="width:16px; height:16px;"><path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71L12 2zM12 15.5l-4.5 2L12 4.5l4.5 13-4.5-2z"/></svg>`
    };

    let currentLoc = null;
    let weekData = [];

    function saveApiKey() {
        const val = document.getElementById('apiKeyInput').value.trim();
        if (val) {
            if (val.includes(" ") || val.includes("object")) {
                showErr("Ungültiges Format: API-Key darf keinen Text oder Leerzeichen enthalten.");
                return;
            }
            localStorage.setItem(API_KEY_STORAGE, val);
            document.getElementById('keySetup').classList.remove('active');
            const status = document.getElementById('status');
            status.innerText = "✓ KI-Schnittstelle aktiv.";
            setTimeout(() => status.innerText = currentLoc ? currentLoc.name : "Bereit", 2000);
        }
    }

    function getEffectiveKey() {
        return apiKey || localStorage.getItem(API_KEY_STORAGE) || "";
    }

    function getLocation() {
        const status = document.getElementById('status');
        if (!navigator.geolocation) {
            showErr("GPS wird von diesem Browser nicht unterstützt.");
            return;
        }
        status.innerHTML = `<span class="loading-dots">Ortung läuft</span>`;
        navigator.geolocation.getCurrentPosition(
            (pos) => {
                const lat = pos.coords.latitude;
                const lon = pos.coords.longitude;
                fetchWeather(lat, lon, "Aktueller Standort");
            },
            (err) => {
                let msg = "Ortung fehlgeschlagen.";
                if (err.code === 1) msg = "Standortzugriff verweigert (Systemeinstellung prüfen).";
                showErr(msg);
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    }

    async function fetchWithRetry(url, options = {}, retries = 5, backoff = 1000) {
        try {
            const res = await fetch(url, options);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
        } catch (err) {
            if (retries <= 0) throw err;
            return new Promise(r => setTimeout(() => r(fetchWithRetry(url, options, retries - 1, backoff * 2)), backoff));
        }
    }

    const getFavs = () => JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    const getBarColor = (val) => val >= 85 ? 'var(--excellent)' : (val >= 60 ? 'var(--neutral)' : 'var(--doubtful)');
    const getScoreColor = (s) => s >= 80 ? 'var(--excellent)' : (s >= 65 ? 'var(--good)' : (s >= 45 ? 'var(--neutral)' : 'var(--doubtful)'));
    const showErr = (m) => { document.getElementById('status').innerHTML = `<span style="color:var(--doubtful); font-weight:600;">${m}</span>`; };

    function getMoonPhase(date) {
        const lp = 2551443; const now = date.getTime();
        const new_moon = new Date(1970, 0, 7, 20, 35, 0).getTime();
        const phase = ((now - new_moon) % lp) / lp;
        if (phase < 0.06 || phase > 0.94) return "Neumond";
        if (phase < 0.56 && phase > 0.44) return "Vollmond";
        return phase < 0.5 ? "Zunehmender Mond" : "Abnehmender Mond";
    }

    function getDecisionLabel(score) {
        if (score >= 81) return { text: "🔥 Epische Bedingungen", color: "var(--excellent)" };
        if (score >= 66) return { text: "✨ Rausgehen lohnt sich", color: "var(--excellent)" };
        if (score >= 46) return { text: "👍 Solide Fotogelegenheit", color: "var(--good)" };
        if (score >= 26) return { text: "🚶‍♂️ Nur für Spaziergang / Details", color: "var(--neutral)" };
        return { text: " Couch-Wetter / Nicht lohnend", color: "var(--doubtful)" };
    }

    async function getAIStrategy(locName, dayIdx, type) {
        const activeKey = getEffectiveKey();
        const resultId = `ai-result-${dayIdx}-${type}`;
        const container = document.getElementById(resultId);
        
        if (!activeKey) {
            container.innerHTML = `<div class="ai-header">Key fehlt</div>Bitte konfiguriere zuerst deinen privaten Gemini API Key.`;
            container.classList.add('visible');
            document.getElementById('keySetup').classList.add('active');
            return;
        }

        const btnId = `ai-btn-${dayIdx}-${type}`;
        const btn = document.getElementById(btnId);
        
        container.innerHTML = `<div class="ai-header">${ICONS.ai} KI-ASSISTENT LÄUFT...</div><span class="loading-dots">Analysiere Setup & Motive</span>`;
        container.classList.add('visible');
        btn.disabled = true;

        const day = weekData[dayIdx];
        const ev = type === 'Morgen' ? day.sunrise : day.sunset;
        const main = ev.samples[1];
        const dateString = day.date.toLocaleDateString('de-DE', { day: '2-digit', month: 'long', year: 'numeric' });

        const isCanvas = window.location.hostname.includes('usercontent.goog');
        const model = isCanvas ? "gemini-2.5-flash-preview-09-2025" : "gemini-2.5-flash";
        
        const systemPrompt = `Du bist ein rationaler Produktions-Assistent.
Antworte ZWINGEND als flaches JSON-Objekt (alle Werte reine Text-Strings) mit exakt diesen Schlüsseln: "tldr", "motives_gear", "timelapse", "interval_val", "interval_reason".
1. "tldr": Knallhartes Kurzfazit in 1 Satz (Lohnt sich die Tour? Welche Kernstimmung herrscht?).
2. "motives_gear": Ein zusammenhängender Text mit 2 Motiv-Ideen. Empfiehl passende Objektive/Brennweiten. Erwähne die Sony A7 IV nur bei zwingender technischer Notwendigkeit.
3. "timelapse": Strategie basierend auf Wolkenzug.
4. "interval_val": Eine Zahl (z.B. "4s").
5. "interval_reason": Kurze Begründung.`;
        
        const userQuery = `Kontext: ${locName}. Datum: ${dateString}. Tour: ${type}.
        Wetter: Temp ${main.temp}°C, Niederschlag ${main.prec}%, Taupunkt-Abst ${ev.dewSpread.toFixed(1)}K. 
        Wolken: Tief ${main.cLow}%, Mittel ${main.cMid}%, Hoch ${main.cHigh}%. 
        Wind: ${main.wind} km/h (Böen ${main.gust} km/h). Mond: ${day.moon.phase}. Score: ${ev.score}%`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${activeKey}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: userQuery }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: { temperature: 0.4, responseMimeType: "application/json" }
                })
            });

            const result = await response.json();
            if (result.error) throw new Error(result.error.message);

            const rawText = result.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!rawText) throw new Error("Leere Antwort vom Modell.");

            const aiData = JSON.parse(rawText);
            const parseVal = (val) => {
                if (!val) return "Keine Daten.";
                if (typeof val === 'string') return val;
                if (Array.isArray(val)) return "• " + val.map(v => typeof v === 'object' ? JSON.stringify(v) : v).join("<br>• ");
                return JSON.stringify(val);
            };
            
            const formattedText = `
                <div class="tldr-box">${parseVal(aiData.tldr)}</div>
                <div class="ai-section-title">Motiv & Setup</div>
                <div style="margin-bottom: 12px;">${parseVal(aiData.motives_gear)}</div>
                
                <details style="margin-top: 10px; cursor: pointer;">
                    <summary class="ai-section-title" style="display: list-item; user-select: none;">
                        Timelapse Strategie <span class="interval-badge">${parseVal(aiData.interval_val).replace(/["'{}]/g, '')}</span>
                    </summary>
                    <div style="padding-top: 8px;">
                        <div style="font-size: 0.8rem; font-weight: 600; color: #a855f7; margin-bottom: 4px;">Coach: ${parseVal(aiData.interval_reason)}</div>
                        <div>${parseVal(aiData.timelapse)}</div>
                    </div>
                </details>
            `;

            container.innerHTML = `<div class="ai-header">${ICONS.ai} PRODUKTIONS-ASSISTENT</div><div>${formattedText}</div>`;
        } catch (e) {
            let errorMsg = e.message;
            if (errorMsg.toLowerCase().includes("quota") || errorMsg.includes("429")) {
                errorMsg = "API-Limit erreicht. Bitte warte ca. 60 Sek.";
            } else if (errorMsg.toLowerCase().includes("demand") || errorMsg.includes("503")) {
                errorMsg = "Temporäre Google Server-Überlastung. Bitte kurz warten.";
            }
            container.innerHTML = `<div class="ai-header" style="color: var(--doubtful);">System-Meldung</div><div style="font-size: 0.85rem;">${errorMsg}</div>`;
        } finally { btn.disabled = false; }
    }

    function analyzeEvent(type, timeStr, hourly) {
        if (!timeStr || !hourly) return null;
        const target = new Date(timeStr).getTime();
        let idx = 0; let min = Infinity;
        hourly.time.forEach((t, i) => { const d = Math.abs(new Date(t + ":00Z").getTime() - target); if (d < min) { min = d; idx = i; } });
        
        const samples = [-1, 0, 1].map(o => {
            const i = idx + o;
            return {
                label: o === 0 ? (type === 'sunrise' ? 'Aufgang' : 'Untergang') : (o > 0 ? `+${o}h` : `${o}h`),
                temp: hourly.temperature_2m[i] || 0, hum: hourly.relative_humidity_2m[i] || 0,
                dew: hourly.dew_point_2m[i] || 0, cTot: hourly.cloud_cover[i] || 0,
                cLow: hourly.cloud_cover_low[i] || 0, cMid: hourly.cloud_cover_mid[i] || 0,
                cHigh: hourly.cloud_cover_high[i] || 0, wind: hourly.wind_speed_10m[i] || 0,
                gust: hourly.wind_gusts_10m[i] || 0, prec: hourly.precipitation_probability[i] || 0,
                lightning: (hourly.lightning_potential || [])[i] || 0
            };
        });

        const m = samples[1];
        let lS = 20; 
        if (m.cTot < 5) {
            lS = 50; 
        } else {
            if (m.cHigh > 25 && m.cHigh < 85) lS += 55; 
            if (m.cMid > 15 && m.cMid < 70) lS += 25;   
            if (m.cLow > 45) lS -= 50;                  
        }
        lS = Math.max(0, Math.min(100, lS));

        const maxPrec = Math.max(...samples.map(s => s.prec));
        const maxGust = Math.max(...samples.map(s => s.gust));
        const maxLight = Math.max(...samples.map(s => s.lightning));
        const minTemp = Math.min(...samples.map(s => s.temp));
        
        let riskNotes = [];
        let rS = 5 + (maxPrec * 0.9); 
        if (maxPrec > 30) riskNotes.push("Niederschlag");
        if (maxGust > 42) { rS += 35; riskNotes.push("Windböen"); }
        if (maxLight > 15) { rS += 60; riskNotes.push("BLITZGEFAHR"); }
        if (minTemp < 1) { rS += 15; riskNotes.push("Frost"); }
        
        const dewSpread = m.temp - m.dew;
        const isFoggy = m.hum >= 93 && dewSpread <= 2.0 && m.wind < 15;
        const isCondensation = dewSpread < 1.5;
        
        const safetyScore = Math.max(0, 100 - rS);
        const finalScore = Math.round((lS * 0.6) + (safetyScore * 0.4));
        
        return { 
            score: finalScore, 
            sub: { light: lS, drama: 35, risk: Math.min(100, Math.round(rS)) }, 
            samples, time: timeStr.split('T')[1], riskNotes, dewSpread, isFoggy, isCondensation 
        };
    }

    async function fetchWeather(latRaw, lonRaw, name) {
        const lat = parseFloat(Number(latRaw).toFixed(2));
        const lon = parseFloat(Number(lonRaw).toFixed(2));
        const status = document.getElementById('status');
        status.innerHTML = `<span class="loading-dots">Analysiere für ${name}</span>`;
        currentLoc = { lat, lon, name };
        localStorage.setItem(LAST_LOC_KEY, JSON.stringify(currentLoc));
        updateFavBtn();

        try {
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&timezone=auto&forecast_days=7&hourly=temperature_2m,relative_humidity_2m,dew_point_2m,precipitation_probability,cloud_cover,cloud_cover_low,cloud_cover_mid,cloud_cover_high,wind_speed_10m,wind_gusts_10m,lightning_potential&daily=sunrise,sunset`;
            const data = await fetchWithRetry(url);
            weekData = [];
            for(let i=0; i<7; i++) {
                const sRise = data.daily.sunrise[i];
                const dayDate = new Date(sRise);
                weekData.push({
                    date: dayDate,
                    sunrise: analyzeEvent('sunrise', sRise, data.hourly),
                    sunset: analyzeEvent('sunset', data.daily.sunset[i], data.hourly),
                    moon: { phase: getMoonPhase(dayDate) }
                });
            }
            renderForecast(name);
            status.innerHTML = `<strong>${name}</strong> (${lat}, ${lon})<br><small>Stand: ${new Date().toLocaleTimeString()} Uhr</small>`;
        } catch(e) { showErr(`Fehler: ${e.message}`); }
    }

    async function searchLocation() {
        const q = document.getElementById('locInput').value.trim();
        if (!q) return;
        const btn = document.getElementById('searchBtn'); btn.disabled = true;
        try {
            const data = await fetchWithRetry(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=5&language=de&format=json`);
            const list = document.getElementById('searchResults');
            if (!data.results) { showErr("Ort nicht gefunden."); return; }
            list.innerHTML = data.results.map(r => `<li onclick="selectResult(${r.latitude}, ${r.longitude}, '${r.name.replace(/'/g, "\\'")}')">${r.name} (${r.country}) <small style="opacity:0.5">${r.latitude.toFixed(2)}/${r.longitude.toFixed(2)}</small></li>`).join('');
            list.classList.remove('hidden');
        } catch(e) { showErr(`Suche fehlgeschlagen.`); } finally { btn.disabled = false; }
    }

    window.selectResult = (lat, lon, name) => { 
        const list = document.getElementById('searchResults');
        while (list.firstChild) { list.removeChild(list.firstChild); }
        list.classList.add('hidden'); 
        fetchWeather(lat, lon, name); 
    };

    function renderForecast(name) {
        const container = document.getElementById('forecast');
        document.getElementById('dashboard').classList.remove('hidden');
        container.innerHTML = weekData.map((day, idx) => `
            <div class="day-accordion ${idx === 0 ? 'open' : ''}">
                <div class="day-header" onclick="this.parentElement.classList.toggle('open')">
                    <span class="day-name">${day.date.toLocaleDateString('de-DE', {weekday:'long', day:'2-digit', month:'long'})}</span>
                    <div class="day-pills">
                        <span class="pill" style="background:${getScoreColor(day.sunrise.score)}">Früh: ${day.sunrise.score}%</span>
                        <span class="pill" style="background:${getScoreColor(day.sunset.score)}">Spät: ${day.sunset.score}%</span>
                        ${ICONS.chevron}
                    </div>
                </div>
                <div class="day-content">
                    <div style="font-size:0.75rem; margin-bottom:15px; color:var(--text-muted);"><span>${ICONS.moon} ${day.moon.phase}</span></div>
                    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:20px;">
                        ${renderEvHTML(day.sunrise, 'Morgentour', 'Sonnenaufgang', ICONS.sunrise, name, idx, 'Morgen')}
                        ${renderEvHTML(day.sunset, 'Abendtour', 'Sonnenuntergang', ICONS.sunset, name, idx, 'Abend')}
                    </div>
                </div>
            </div>
        `).join('');
    }

    function renderEvHTML(ev, label, timeLabel, icon, locName, dayIdx, type) {
        if (!ev) return '';
        const safety = Math.max(0, 100 - ev.sub.risk);
        const sColor = getBarColor(safety);
        const dLabel = getDecisionLabel(ev.score);
        
        let badges = '';
        if (ev.isFoggy) badges += `<span class="badge badge-fog">Nebelchance</span>`;
        if (ev.isCondensation) badges += `<span class="badge badge-cond">Kondensationsrisiko!</span>`;
        if (ev.riskNotes.includes("Niederschlag")) badges += `<span class="badge badge-cond">Regen</span>`;
        if (ev.riskNotes.includes("Windböen")) badges += `<span class="badge badge-cond">Wind</span>`;

        return `
            <div>
                <div style="margin-bottom:12px; border-bottom:1px solid var(--border); padding-bottom:8px;">
                    <span class="decision-label" style="color: ${dLabel.color}">${dLabel.text}</span>
                    <span class="decision-sub">${icon} ${label} (${ev.score}%) • ${timeLabel}: ${ev.time} Uhr</span>
                    ${badges}
                </div>
                
                <div class="dim-row">
                    <div class="dim-label"><span>Licht-Potential</span><span>${ev.sub.light}%</span></div>
                    <div class="dim-bar-bg"><div class="dim-bar-fill" style="width:${ev.sub.light}%; background:${getBarColor(ev.sub.light)}"></div></div>
                </div>
                <div class="dim-row">
                    <div class="dim-label"><span>Machbarkeit & Komfort</span><span style="color:${sColor}; font-weight:700;">${safety}%</span></div>
                    <div class="dim-bar-bg"><div class="dim-bar-fill" style="width:${safety}%; background:${sColor}"></div></div>
                </div>

                <div class="ai-result-box" id="ai-result-${dayIdx}-${type}"></div>
                
                <div class="table-container">
                    <table>
                        <thead><tr><th>Phase</th><th>Temp</th><th>Wolken (H/M/L)</th><th>Wind/Böen</th></tr></thead>
                        <tbody>${ev.samples.map(s => `<tr><td>${s.label}</td><td>${s.temp.toFixed(0)}°</td><td>${s.cHigh}%/${s.cMid}%/${s.cLow}%</td><td>${s.wind.toFixed(0)}/${s.gust.toFixed(0)} km/h</td></tr>`).join('')}</tbody>
                    </table>
                </div>
                
                <div style="display:flex; gap:8px; margin-top:10px;">
                    <button class="btn-ai" id="ai-btn-${dayIdx}-${type}" onclick="getAIStrategy('${locName}', ${dayIdx}, '${type}')" style="flex:1;">
                        ${ICONS.ai} KI-Assistent
                    </button>
                    <button class="btn-secondary" style="flex:1; font-size:0.7rem;" onclick="copyTourLog('${locName}', ${dayIdx}, '${type}')">
                        ${ICONS.export} Log kopieren
                    </button>
                </div>
            </div>
        `;
    }

    function toggleFavorite() {
        if (!currentLoc) return;
        let f = getFavs(); const i = f.findIndex(x => x.name === currentLoc.name);
        if (i === -1) f.push(currentLoc); else f.splice(i, 1);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(f)); renderFavorites(); updateFavBtn();
    }
    function renderFavorites() {
        const f = getFavs(); const c = document.getElementById('favoritesContainer');
        if (!c) return;
        c.innerHTML = f.map((x,i) => `<div class="fav-chip" onclick="fetchWeather(${x.lat},${x.lon},'${x.name}')">${x.name} <span onclick="event.stopPropagation(); removeFavorite(${i})">✕</span></div>`).join('');
        c.classList.toggle('hidden', f.length === 0);
    }
    function removeFavorite(i) { let f = getFavs(); f.splice(i,1); localStorage.setItem(STORAGE_KEY, JSON.stringify(f)); renderFavorites(); updateFavBtn(); }
    function updateFavBtn() { 
        const b = document.getElementById('saveFavBtn'); if (!currentLoc) return;
        b.classList.remove('hidden'); b.style.opacity = getFavs().some(x => x.name === currentLoc.name) ? '1' : '0.4'; 
    }

    function copyTourLog(name, dayIdx, type) {
        const day = weekData[dayIdx];
        const ev = type === 'Morgen' ? day.sunrise : day.sunset;
        const main = ev.samples[1];
        const log = `FOTO-LOG [${name}] - ${day.date.toLocaleDateString()} (${type})\nLICHT-SCORE: ${ev.score}% | KOMFORT: ${100-ev.sub.risk}%`;
        const el = document.createElement('textarea'); el.value = log; document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
        const s = document.getElementById('status'); const old = s.innerText; s.innerText = `✓ Kopiert`; setTimeout(() => s.innerText = old, 2000);
    }

    function init() {
        const h = document.getElementById('mainHeroImg');
        if(h) h.onerror = () => { h.src = 'https://images.unsplash.com/photo-1534067783941-51c9c23ecefd?w=1200&q=80'; };
        const storedKey = localStorage.getItem(API_KEY_STORAGE);
        if (storedKey) { document.getElementById('apiKeyInput').value = storedKey; }
        renderFavorites();
        const last = JSON.parse(localStorage.getItem(LAST_LOC_KEY));
        if (last) fetchWeather(last.lat, last.lon, last.name);
    }
    init();
</script>
